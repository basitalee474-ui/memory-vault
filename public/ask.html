<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Help remember — Memory Vault</title><style>body{margin:0;min-height:100vh;background:#070B14;color:#F8FAFC;font:18px/1.6 system-ui,Arial,sans-serif;padding:16px}main{max-width:640px;margin:auto;background:#0D1322;border:1px solid #ffffff22;border-radius:20px;padding:24px}input,textarea{width:100%;min-height:52px;font:inherit;padding:10px 14px;border-radius:14px;border:2px solid #ffffff33;background:#070B14;color:#fff;margin:6px 0 12px}textarea{min-height:130px}button{min-height:52px;padding:0 22px;border:0;border-radius:14px;font:inherit;font-weight:800;color:#fff;background:linear-gradient(135deg,#8B5CF6,#06B6D4);cursor:pointer;margin:4px 6px 4px 0}img{max-width:100%;border-radius:12px;border:8px solid #5a4220}a{color:#06B6D4}.m{padding:10px 14px;border-radius:12px;margin:10px 0;background:#7f1d1d}.m.ok{background:#14532d}</style></head><body><main><b style="letter-spacing:.14em;color:#06B6D4">MEMORY VAULT</b><div id="v">Loading…</div><div id="m" role="alert"></div></main>
<script>
const t=new URLSearchParams(location.search).get("t"),$=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));let voice=null,rec=null;
const api=async(m,b)=>{const r=await fetch("/api/ask/"+encodeURIComponent(t),{method:m,headers:{"Content-Type":"application/json","X-Requested-With":"memoryvault"},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Something went wrong. Please try again.");return d};
const msg=(x,ok)=>$("#m").innerHTML=x?'<div class="m '+(ok?"ok":"")+'">'+esc(x)+"</div>":"";
api("GET").then(d=>{$("#v").innerHTML='<h2>Can you help?</h2><p>Someone in your family would like to hear what you remember about this photograph.</p><img src="'+esc(d.photo)+'" alt="Family photograph"><h3>'+esc(d.question)+'</h3><label for="n">Your name</label><input id="n"><label for="a">Your answer</label><textarea id="a"></textarea><button id="r" type="button">🎤 Record my voice (optional)</button><span id="rs"></span><br><button id="s" type="button">Send my answer</button><p><small>Your answer is shown to the family only after they approve it.</small></p>';
$("#r").onclick=async()=>{if(rec&&rec.state==="recording"){rec.stop();return}if(!navigator.mediaDevices||!window.MediaRecorder)return msg("Recording is not available on this device. You can type your answer.");
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[];rec=new MediaRecorder(st);rec.ondataavailable=e=>ch.push(e.data);rec.onstop=()=>{st.getTracks().forEach(x=>x.stop());const b=new Blob(ch,{type:rec.mimeType});if(b.size>2.5e6){msg("That recording is too long. Please record a shorter one.");return}const f=new FileReader();f.onload=()=>{voice=f.result;$("#rs").textContent="✅ Recording ready";$("#r").textContent="🎤 Record again"};f.readAsDataURL(b)};rec.start();$("#r").textContent="■ Stop recording"}catch(e){msg("We could not use the microphone. Please allow it and try again.")}};
$("#s").onclick=async()=>{msg("");try{await api("POST",{name:$("#n").value,text:$("#a").value,voice});$("#v").innerHTML="<h2>✅ Thank you!</h2><p>Your answer was sent to the family.</p>"}catch(e){msg(e.message)}}}).catch(e=>{$("#v").innerHTML="<h2>This link doesn't work</h2><p>"+esc(e.message)+"</p>"});
</script></body></html>
