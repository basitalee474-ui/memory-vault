<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Memory Vault</title><style>body{margin:0;min-height:100vh;background:#070B14;color:#F8FAFC;font:18px/1.6 system-ui,Arial,sans-serif;padding:16px}main{max-width:640px;margin:auto;background:#0D1322;border:1px solid #ffffff22;border-radius:20px;padding:24px}input,textarea{width:100%;min-height:52px;font:inherit;padding:10px 14px;border-radius:14px;border:2px solid #ffffff33;background:#070B14;color:#fff;margin:6px 0 12px}textarea{min-height:130px}button{min-height:52px;padding:0 22px;border:0;border-radius:14px;font:inherit;font-weight:800;color:#fff;background:linear-gradient(135deg,#8B5CF6,#06B6D4);cursor:pointer;margin:4px 6px 4px 0}img{max-width:100%;border-radius:12px;border:8px solid #5a4220}a{color:#06B6D4}.m{padding:10px 14px;border-radius:12px;margin:10px 0;background:#7f1d1d}.m.ok{background:#14532d}</style></head><body><main><h1>Admin</h1><div id="v">Loading…</div></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api=async(p,m)=>{const r=await fetch("/api/"+p,{method:m||"GET",headers:{"Content-Type":"application/json","X-Requested-With":"memoryvault"}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Error");return d};
async function load(){try{const s=await api("admin/stats"),r=(await api("admin/reports")).reports;
document.getElementById("v").innerHTML="<p>Users: <b>"+s.users+"</b> · Memories: <b>"+s.memories+"</b> · Storage: <b>"+(s.storageBytes/1048576).toFixed(1)+" MB</b></p><h2>Open reports ("+r.length+")</h2>"+(r.map(x=>"<p><b>"+esc(x.title)+"</b><br>"+esc(x.reason)+'<br><button data-a="takedown" data-i="'+x.id+'">Make private</button><button data-a="dismiss" data-i="'+x.id+'">Dismiss</button></p>').join("")||"<p>No open reports.</p>");
document.querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{await api("admin/reports/"+b.dataset.i+"/"+b.dataset.a,"POST");load()})}catch(e){document.getElementById("v").innerHTML='<p class="m">You need to be an admin and logged in. <a href="/">Log in</a></p>'}}load();
</script></body></html>
